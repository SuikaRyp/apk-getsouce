name: Build & Automated GitHub Release (Android, iOS & Windows)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. BUILD ANDROID APK
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Sync Capacitor Android
        run: node node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Generate Fresh Keystore
        run: |
          rm -f android/app/release.keystore
          keytool -genkey -v -keystore android/app/release.keystore -alias suikasource -keyalg RSA -keysize 2048 -validity 10000 -storepass android123 -keypass android123 -dname "CN=suikasource, OU=App, O=suikasourceOrg, L=Jakarta, S=ID, C=ID"

      - name: Build Android Signed Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuikaSource-Android-APK
          path: android/app/build/outputs/apk/release/*.apk

  # ==========================================
  # 2. BUILD IOS IPA PACKAGE
  # ==========================================
  build-ios:
    name: Build iOS IPA Package
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Sync Capacitor iOS
        run: node node_modules/@capacitor/cli/bin/capacitor sync ios

      - name: Build iOS App via Xcode
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath ios/build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Package App into .IPA File
        run: |
          mkdir -p ios/Payload
          cp -r ios/build/Build/Products/Release-iphoneos/App.app ios/Payload/
          cd ios
          zip -r SuikaSource-iOS.ipa Payload
          cd ..

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuikaSource-iOS-IPA
          path: ios/SuikaSource-iOS.ipa

  # ==========================================
  # 3. BUILD WINDOWS EXE INSTALLER
  # ==========================================
  build-windows:
    name: Build Windows EXE (Tauri)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Windows App (Tauri)
        run: npx tauri build

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuikaSource-Windows-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  # ==========================================
  # 4. AUTOMATED GITHUB RELEASE & ASSETS UPLOAD
  # ==========================================
  create-release:
    name: Auto Release & Upload Binaries
    needs: [build-android, build-ios, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: SuikaSource-Android-APK
          path: dl/android

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: SuikaSource-iOS-IPA
          path: dl/ios
        continue-on-error: true

      - name: Download Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: SuikaSource-Windows-Installer
          path: dl/windows
        continue-on-error: true

      - name: Prepare Final Binaries
        run: |
          mkdir -p release-files
          if [ -d dl/android ]; then
            cp dl/android/*.apk release-files/SuikaSource-v1.0.0-Android.apk || true
          fi
          if [ -d dl/ios ]; then
            cp dl/ios/*.ipa release-files/SuikaSource-v1.0.0-iOS.ipa || true
          fi
          if [ -d dl/windows ]; then
            cp dl/windows/*.exe release-files/SuikaSource-v1.0.0-Windows-Setup.exe || true
            cp dl/windows/*.msi release-files/SuikaSource-v1.0.0-Windows.msi || true
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "SuikaSource v1.0.0 - Official Multi-Platform Release 🚀"
          body: |
            ## ⚡ SuikaSource v1.0.0 Release

            Aplikasi Website Source Code Extractor & Live Inspector teruji lintas platform.

            ### 📦 Binaries Download:
            - 📱 **Android**: `SuikaSource-v1.0.0-Android.apk`
            - 🍎 **iOS**: `SuikaSource-v1.0.0-iOS.ipa`
            - 💻 **Windows**: `SuikaSource-v1.0.0-Windows-Setup.exe`

            ### ✨ Fitur Utama:
            - **Ekstraksi Code Complete**: HTML, Inline & External JS, Stylesheets CSS, Assets Media/Images.
            - **Auto-Download Direct ZIP**: Mengunduh seluruh paket source code langsung ke direktori Download.
            - **Live Web Preview**: Pratinjau responsif dengan mode Desktop, Laptop, Tablet, dan Mobile.
            - **Desain Ultra Premium**: Tema Putih & Biru elegan dengan Prism syntax highlighting.
          files: release-files/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
